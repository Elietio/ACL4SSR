ruleset=🌏 国内媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Steam.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Epic.list

; 基础规则
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve
ruleset=🐟 漏网之鱼,[]FINAL

;--- 策略组 ---
custom_proxy_group=🚀 节点选择`select`[]👑 专线&住宅IP`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇨🇳 台湾节点`[]🇰🇷 韩国节点`[]🇬🇧 英国节点`[]🇩🇪 德国节点`[]🌐 冷门地区`[]🪙 0.1x省流`[]⚡ 5x隧道`[]🚀 手动切换`[]DIRECT
custom_proxy_group=🚀 手动切换`select`^(?!.*(剩余|重置|到期|群|请打开|以下)).*

; 分流策略
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`[]👑 专线&住宅IP`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🚀 手动切换
custom_proxy_group=Ⓜ️ 微软Bing`select`[]DIRECT`[]🚀 节点选择`[]👑 专线&住宅IP`[]🇺🇲 美国节点`[]🇸🇬 狮城节点`[]🚀 手动切换
custom_proxy_group=Ⓜ️ 微软云盘`select`[]DIRECT`[]🚀 节点选择`[]👑 专线&住宅IP`[]🚀 手动切换
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择`[]👑 专线&住宅IP`[]🚀 手动切换
custom_proxy_group=📢 谷歌FCM`select`[]DIRECT`[]🚀 节点选择`[]👑 专线&住宅IP`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🚀 手动切换
custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`[]👑 专线&住宅IP`[]🇸🇬 狮城节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🚀 手动切换
custom_proxy_group=💬 Ai平台`select`[]👑 专线&住宅IP`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇰🇷 韩国节点`[]🚀 手动切换
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]👑 专线&住宅IP`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🪙 0.1x省流`[]🚀 手动切换
custom_proxy_group=🎥 奈飞视频`select`[]🔓 解锁流媒体`[]👑 专线&住宅IP`[]🇸🇬 狮城节点`[]🇨🇳 台湾节点`[]🇯🇵 日本节点`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]⚡ 5x隧道`[]🚀 手动切换
custom_proxy_group=📺 巴哈姆特`select`[]🇨🇳 台湾节点`[]🇭🇰 香港节点`[]👑 专线&住宅IP`[]🚀 节点选择`[]🚀 手动切换`[]DIRECT
custom_proxy_group=🌍 国外媒体`select`[]🔓 解锁流媒体`[]👑 专线&住宅IP`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]⚡ 5x隧道`[]🚀 手动切换`[]DIRECT
custom_proxy_group=🌏 国内媒体`select`[]DIRECT`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🚀 节点选择
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🎮 CN游戏`[]👑 专线&住宅IP`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🚀 手动切换

; 特色梯队分组
custom_proxy_group=👑 专线&住宅IP`select`(专线|住宅IP|家宽|BGP)
custom_proxy_group=🔓 解锁流媒体`select`^(?!.*(以下|均为|均解锁)).*(Netflix|4G|家宽|流媒体|解锁)
custom_proxy_group=🪙 0.1x省流`select`(0\.1x|0\.1X|省流)
custom_proxy_group=⚡ 5x隧道`select`(5x|5X|隧道)
custom_proxy_group=🌐 冷门地区`select`(瑞士|苏黎世|Zurich|巴西|圣保罗|Sao Paulo|迪拜|Dubai|阿联酋|加拿大|多伦多|Toronto|泰国|TH|Thailand)

; 国家地区分组 (排除跨国隧道落地误判)
custom_proxy_group=🇭🇰 香港节点`select`^(?!.*(苏黎世|Zurich|首尔|迪拜|圣保罗|多伦多|凤凰城)).*(港|HK|hk|Hong Kong|HongKong|hongkong)
custom_proxy_group=🇸🇬 狮城节点`select`(新加坡|坡|狮城|SG|Singapore)
custom_proxy_group=🇺🇲 美国节点`select`(美|美国|US|United States|Phoenix|凤凰城|波特兰|达拉斯|俄勒冈|费利民|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥)
custom_proxy_group=🇯🇵 日本节点`select`^(?!.*(首尔|Seoul|多伦多|Toronto|凤凰城|Phoenix)).*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)
custom_proxy_group=🇩🇪 德国节点`select`^(?!.*(迪拜|Dubai|英国|UK|圣保罗|Sao Paulo)).*(德国|DE|Germany|GER|法兰克福|Frankfurt)
custom_proxy_group=🇬🇧 英国节点`select`(英国|英|UK|United Kingdom|Britain|伦敦|London)
custom_proxy_group=🇨🇳 台湾节点`select`(台|TW|Taiwan|家宽)
custom_proxy_group=🇰🇷 韩国节点`select`(韩国|韩|KR|Korea|首尔|Seoul|Kr)

; CN 游戏 / CN 电信直连分组（低延迟直连，不参与代理测速）
custom_proxy_group=🎮 CN游戏`select`[]DIRECT`(游戏|上海游戏|深圳游戏)
custom_proxy_group=📡 CN电信`select`[]DIRECT`(电信|移动|联通|CN-|中国-HY2)

custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]📡 CN电信`[]🚀 节点选择`[]🚀 手动切换
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]🚀 手动切换

enable_rule_generator=true
overwrite_original_rules=true
