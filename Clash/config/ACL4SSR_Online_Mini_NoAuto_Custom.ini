[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则-在线版-安卓精简性能版

;去广告：支持
;自动测速：不支持
;微软分流：不支持
;苹果分流：不支持
;增强中国IP段：不支持
;增强国外GFW：不支持
;节点专属分级：专线住宅/0.1x省流/5x中转/冷门地区/流媒体解锁

;--- 规则集 ---
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

; 安卓核心：Google FCM 推送分流
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list

; 社交与工具
ruleset=📲 电报消息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list

; 媒体精简：仅保留油管和流媒体
ruleset=📹 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list

ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve
ruleset=🐟 漏网之鱼,[]FINAL

;--- 策略组 ---
custom_proxy_group=🚀 节点选择`select`[]👑 专线&住宅IP`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇨🇳 台湾节点`[]🇰🇷 韩国节点`[]🇬🇧 英国节点`[]🇩🇪 德国节点`[]🌐 冷门地区`[]🪙 0.1x省流`[]🎬 5x中转流媒体`[]🚀 手动切换`[]DIRECT
custom_proxy_group=🚀 手动切换`select`^(?!.*(剩余|重置|到期|群|请打开|以下)).*

; 手机端分流策略：默认跟随节点选择或优先纯净高质节点
custom_proxy_group=📢 谷歌FCM`select`[]DIRECT`[]🚀 节点选择`[]👑 专线&住宅IP`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🚀 手动切换
custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`[]👑 专线&住宅IP`[]🇸🇬 狮城节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🚀 手动切换
custom_proxy_group=💬 Ai平台`select`[]👑 专线&住宅IP`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇰🇷 韩国节点`[]🚀 手动切换
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]👑 专线&住宅IP`[]🇭🇰 香港节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🪙 0.1x省流`[]🚀 手动切换
custom_proxy_group=🌍 国外媒体`select`[]🔓 解锁流媒体`[]👑 专线&住宅IP`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🎬 5x中转流媒体`[]🚀 手动切换`[]DIRECT

; 特色梯队分组
custom_proxy_group=👑 专线&住宅IP`select`(专线|住宅IP|家宽|BGP)
custom_proxy_group=🔓 解锁流媒体`select`^(?!.*(以下|均为|均解锁)).*(Netflix|4G|家宽|流媒体|解锁)
custom_proxy_group=🪙 0.1x省流`select`(0\.1x|0\.1X|省流)
custom_proxy_group=🎬 5x中转流媒体`select`(5x|5X|隧道)
custom_proxy_group=🌐 冷门地区`select`(瑞士|苏黎世|Zurich|巴西|圣保罗|Sao Paulo|迪拜|Dubai|阿联酋|加拿大|多伦多|Toronto|泰国|TH|Thailand)

; 国家地区分组 (排除跨国隧道落地误判)
custom_proxy_group=🇭🇰 香港节点`select`^(?!.*(苏黎世|Zurich|首尔|迪拜|圣保罗|多伦多|凤凰城)).*(港|HK|hk|Hong Kong|HongKong|hongkong)
custom_proxy_group=🇸🇬 狮城节点`select`(新加坡|坡|狮城|SG|Singapore)
custom_proxy_group=🇺🇲 美国节点`select`(美|美国|US|United States|Phoenix|凤凰城|波特兰|达拉斯|俄勒冈|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥)
custom_proxy_group=🇯🇵 日本节点`select`^(?!.*(首尔|Seoul|多伦多|Toronto|凤凰城|Phoenix)).*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)
custom_proxy_group=🇩🇪 德国节点`select`^(?!.*(迪拜|Dubai|英国|UK|圣保罗|Sao Paulo)).*(德国|DE|Germany|GER|法兰克福|Frankfurt)
custom_proxy_group=🇬🇧 英国节点`select`(英国|英|UK|United Kingdom|Britain|伦敦|London)
custom_proxy_group=🇨🇳 台湾节点`select`(台|TW|Taiwan|家宽)
custom_proxy_group=🇰🇷 韩国节点`select`(韩国|韩|KR|Korea|首尔|Seoul|Kr)

custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]🚀 手动切换
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]🚀 手动切换

enable_rule_generator=true
overwrite_original_rules=true
